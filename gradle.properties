org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
# phone-eye deliberately uses NO AndroidX libraries (framework widgets only).
# The flag stays true (jetifier is off, nothing is rewritten) so AGP never
# argues about it — having no support libraries is a choice, not a setting.
android.useAndroidX=true
android.nonTransitiveRClass=true
